[project]
name = "openwhisper-asr"
version = "0.1.0"
description = "OpenWhisper ASR Worker"
requires-python = ">=3.10,<3.12"
dependencies = [
    "numpy>=1.24.0",
    "sounddevice>=0.4.6",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
    "black>=23.0",
    "mypy>=1.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/openwhisper_asr"]

[tool.black]
line-length = 100

[tool.mypy]
python_version = "3.10"
strict = true