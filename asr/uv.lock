version = 1
revision = 3
requires-python = ">=3.10, <3.12"
resolution-markers = [
    "python_full_version >= '3.11' and platform_machine != 's390x' and sys_platform == 'win32'",
    "python_full_version >= '3.11' and platform_machine != 's390x' and sys_platform == 'emscripten'",
    "python_full_version >= '3.11' and platform_machine != 's390x' and sys_platform != 'emscripten' and sys_platform != 'win32'",
    "python_full_version >= '3.11' and platform_machine == 's390x' and sys_platform == 'win32'",
    "python_full_version >= '3.11' and platform_machine == 's390x' and sys_platform == 'emscripten'",
    "python_full_version >= '3.11' and platform_machine == 's390x' and sys_platform != 'emscripten' and sys_platform != 'win32'",
    "python_full_version < '3.11' and platform_machine != 's390x'",
    "python_full_version < '3.11' and platform_machine == 's390x'",
]

[[package]]
name = "openwhisper-asr"
version = "0.1.0"
source = { editable = "../../openwhisper-asr" }

[package.metadata]
requires-dist = [
    { name = "huggingface-hub", marker = "extra == 'nemo'", specifier = ">=0.20.0" },
    { name = "mypy", marker = "extra == 'dev'", specifier = ">=1.0" },
    { name = "nemo-toolkit", extras = ["asr"], marker = "extra == 'nemo'", specifier = ">=1.21.0" },
    { name = "numpy", marker = "extra == 'nemo'", specifier = ">=1.24.0" },
    { name = "numpy", marker = "extra == 'recording'", specifier = ">=1.24.0" },
    { name = "psutil", marker = "extra == 'nemo'", specifier = ">=5.9.0" },
    { name = "pytest", marker = "extra == 'dev'", specifier = ">=7.0" },
    { name = "sounddevice", marker = "extra == 'recording'", specifier = ">=0.4.6" },
    { name = "torch", marker = "extra == 'nemo'", specifier = ">=2.0" },
    { name = "torchaudio", marker = "extra == 'nemo'", specifier = ">=2.0" },
]
provides-extras = ["nemo", "recording", "dev"]

[[package]]
name = "openwhisper-asr-service"
version = "0.1.0"
source = { virtual = "." }
dependencies = [
    { name = "openwhisper-asr" },
]

[package.metadata]
requires-dist = [{ name = "openwhisper-asr", editable = "../../openwhisper-asr" }]
