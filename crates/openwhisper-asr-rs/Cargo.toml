[package]
name = "openwhisper-asr-rs"
version = "0.1.0"
edition = "2021"
description = "Rust ASR worker bootstrap for OpenWhisper"
license = "MIT"

[[bin]]
name = "ow-asr-rs"
path = "src/main.rs"

[dependencies]
anyhow = "1.0"
cpal = "0.15"
env_logger = "0.11"
hound = "3.5"
log = "0.4"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

[target.'cfg(target_os = "linux")'.dependencies]
libc = "0.2"

[dev-dependencies]
tempfile = "3.8"
