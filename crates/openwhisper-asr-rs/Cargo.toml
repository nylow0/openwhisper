[package]
name = "openwhisper-asr-rs"
version = "0.1.0"
edition = "2021"
description = "Rust ASR worker bootstrap for OpenWhisper"
license = "MIT"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "1"

[target.'cfg(target_os = "windows")'.dependencies]
cpal = "0.15"
