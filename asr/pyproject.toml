[project]
name = "openwhisper-asr"
version = "0.1.0"
description = "Reusable ASR core for OpenWhisper products"
readme = "README.md"
requires-python = ">=3.10,<3.12"
dependencies = [
    "sounddevice>=0.4.6",
]

[project.optional-dependencies]
nemo = [
    "numpy>=1.24.0",
    "torch>=2.0",
    "torchaudio>=2.0",
    "nemo-toolkit[asr]>=1.21.0",
    "huggingface-hub>=0.20.0",
    "psutil>=5.9.0",
]
recording = [
    "numpy>=1.24.0",
]
dev = [
    "pytest>=7.0",
    "mypy>=1.0",
]

[project.scripts]
ow-asr = "openwhisper_asr.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["openwhisper_asr"]

[tool.mypy]
python_version = "3.10"
strict = true

[tool.pytest.ini_options]
testpaths = ["tests"]
